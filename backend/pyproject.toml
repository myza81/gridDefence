[project]
name = "griddefence-backend"
version = "0.1.0"
description = "GridDefence backend — engineering platform for transmission grid defence schemes"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "bcrypt>=4.2,<5.0",
    "redis>=5.0,<6.0",
    "rq>=1.16,<2.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "fakeredis>=2.25,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# "tests" holds cross-module/infrastructure tests (Phase 0); "app" is walked
# so each module's own tests/ package (e.g. app/modules/iam/tests/) is
# discovered too, per docs/architecture/implementation-plan.md §1's
# per-module test layout.
testpaths = ["tests", "app"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on `Depends(...)` (and
# similar) being evaluated as an argument default — the standard, documented
# FastAPI pattern, not the accidental-mutable-default bug B008 exists to
# catch elsewhere.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "app.modules.iam.dependencies.require_permission",
]

[tool.ruff.lint.per-file-ignores]
# Migration files follow Alembic's own generated-script convention
# (Union/Sequence from typing) so they stay consistent with what
# `alembic revision --autogenerate` itself produces.
"alembic/versions/*.py" = ["UP035", "UP007"]
